<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grand Reserve — สั่งจองวิสกี้พรีเมียม</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
        overflow-x: hidden;
      }
      /* Prevent iOS Safari auto-zoom on input focus */
      input, select, textarea, button {
        font-family: inherit;
      }
      input[type="text"], input[type="tel"], input[type="datetime-local"], select {
        font-size: 16px !important;
      }
      /* Sleek scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #14161f;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d3146;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d97706;
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #0f1015; color: #f3f4f6; font-family: 'Prompt', system-ui, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
